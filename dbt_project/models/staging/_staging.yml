version: 2

models:
  - name: stg_customers
    description: "לקוח אחד לכל שורה, אחרי ניקוי ודה-דופליקציה"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [unique, not_null]

  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'refunded', 'pending', 'cancelled']
      - name: customer_id
        data_tests:
          # יש הזמנות של לקוחות שלא קיימים - הבדיקה מתריעה (warn) ולא עוצרת
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
              config:
                severity: warn

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
